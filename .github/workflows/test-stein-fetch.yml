name: Test stein-fetch

on:
  push:
    branches: [ main, master, develop, typescript ]
    paths:
      - 'packages/stein-fetch/**'
      - 'package.json'
      - 'lerna.json'
      - '.github/workflows/test-stein-fetch.yml'
  pull_request:
    branches: [ main, master, develop, typescript ]
    paths:
      - 'packages/stein-fetch/**'
      - 'package.json'
      - 'lerna.json'
      - '.github/workflows/test-stein-fetch.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps
        npx lerna bootstrap

    - name: Build stein-fetch
      run: |
        cd packages/stein-fetch
        npm run build

    - name: Run tests
      run: |
        cd packages/stein-fetch
        npm test